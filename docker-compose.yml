version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  env_file: .env
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fuelco:fuelco123@postgres/fuelco_db
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: fuelco
      POSTGRES_PASSWORD: fuelco123
      POSTGRES_DB: fuelco_db
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fuelco"]
      interval: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@fuelco.com && airflow webserver"
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

volumes:
  pg-data:
